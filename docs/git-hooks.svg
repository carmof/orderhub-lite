<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="980" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Commit flow with Husky, lint-staged and commitlint</title>
  <desc id="d">git commit triggers the Husky pre-commit hook, which runs lint-staged. Then the commit-msg hook runs commitlint. If either check fails the commit is aborted, otherwise the commit is created.</desc>
  <style>
    .fg { fill: #1e293b; }
    .line { stroke: #475569; }
    .head { fill: #475569; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e2e8f0; }
      .line { stroke: #94a3b8; }
      .head { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="980" height="370" rx="12" fill="#808080" fill-opacity="0.15" stroke="#808080" stroke-opacity="0.4"/>
  <text x="25" y="38" class="fg" font-size="18" font-weight="700">What happens on git commit</text>

  <!-- 1 git commit -->
  <rect x="25" y="70" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="90" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">git commit</text>
  <text x="90" y="127" text-anchor="middle" font-size="12" fill="#475569">staged files +</text>
  <text x="90" y="144" text-anchor="middle" font-size="12" fill="#475569">commit message</text>

  <!-- 2 pre-commit (husky) -->
  <rect x="185" y="70" width="130" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="250" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">pre-commit</text>
  <text x="250" y="127" text-anchor="middle" font-size="12" fill="#1e40af">.husky/pre-commit</text>
  <text x="250" y="144" text-anchor="middle" font-size="12" fill="#1e40af">runs lint-staged</text>

  <!-- 3 lint-staged -->
  <rect x="345" y="70" width="130" height="90" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="410" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">lint-staged</text>
  <text x="410" y="127" text-anchor="middle" font-size="12" fill="#166534">ESLint + Prettier</text>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#166534">on staged files only</text>

  <!-- 4 commit-msg (husky) -->
  <rect x="505" y="70" width="130" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="570" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">commit-msg</text>
  <text x="570" y="127" text-anchor="middle" font-size="12" fill="#1e40af">.husky/commit-msg</text>
  <text x="570" y="144" text-anchor="middle" font-size="12" fill="#1e40af">runs commitlint</text>

  <!-- 5 commitlint -->
  <rect x="665" y="70" width="130" height="90" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="730" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">commitlint</text>
  <text x="730" y="127" text-anchor="middle" font-size="12" fill="#166534">Conventional Commits</text>
  <text x="730" y="144" text-anchor="middle" font-size="12" fill="#166534">message rules</text>

  <!-- 6 commit created -->
  <rect x="825" y="70" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="890" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Commit created</text>
  <text x="890" y="127" text-anchor="middle" font-size="12" fill="#475569">both checks</text>
  <text x="890" y="144" text-anchor="middle" font-size="12" fill="#475569">passed</text>

  <!-- success arrows -->
  <g class="line" stroke-width="2" marker-end="url(#arrow)">
    <line x1="155" y1="115" x2="183" y2="115"/>
    <line x1="315" y1="115" x2="343" y2="115"/>
    <line x1="475" y1="115" x2="503" y2="115"/>
    <line x1="635" y1="115" x2="663" y2="115"/>
    <line x1="795" y1="115" x2="823" y2="115"/>
  </g>
  <text x="330" y="106" text-anchor="middle" class="fg" font-size="11">runs</text>
  <text x="650" y="106" text-anchor="middle" class="fg" font-size="11">runs</text>
  <text x="810" y="106" text-anchor="middle" font-size="11" fill="#16a34a">pass</text>

  <!-- failure arrows -->
  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)">
    <line x1="410" y1="160" x2="480" y2="238"/>
    <line x1="730" y1="160" x2="660" y2="238"/>
  </g>
  <text x="425" y="210" font-size="12" font-weight="600" fill="#b91c1c">fails</text>
  <text x="705" y="210" text-anchor="end" font-size="12" font-weight="600" fill="#b91c1c">fails</text>

  <rect x="425" y="240" width="290" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="570" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Commit aborted: fix and retry</text>

  <!-- legend -->
  <rect x="25" y="326" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="49" y="339" class="fg" font-size="12">Husky: the Git hook that triggers the check</text>
  <rect x="335" y="326" width="16" height="16" rx="3" fill="#dcfce7" stroke="#16a34a"/>
  <text x="359" y="339" class="fg" font-size="12">Check run by the hook</text>
</svg>
