name: orders-api

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderhub
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres

volumes:
  pg-data:
